<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Ticket</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">College Support Portal</div>
        <nav class="nav-links">
          <a href="/student-dashboard.html">Dashboard</a>
          <a href="/create-ticket.html">Create Ticket</a>
          <a href="/ticket-list.html">Tickets</a>
        </nav>
        <div class="nav-actions">
          <button class="ghost-btn" onclick="logoutUser()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <h1>Create New Ticket</h1>
      </div>

      <section class="section-card">
        <form id="ticketForm">
          <div class="form-grid">
            <div id="studentFieldWrapper" style="display:none;">
              <label for="studentSelect">Student</label>
              <select id="studentSelect" name="student_id"></select>
            </div>

            <div>
              <label for="categorySelect">Category</label>
              <select id="categorySelect" name="category" required>
                <option value="Fees">Fees</option>
                <option value="Attendance">Attendance</option>
                <option value="ID Card">ID Card</option>
                <option value="Documents">Documents</option>
                <option value="Certificate">Certificate</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label for="prioritySelect">Priority</label>
              <select id="prioritySelect" name="priority" required>
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>

            <div style="grid-column: 1 / -1;">
              <label for="subjectInput">Subject</label>
              <input id="subjectInput" name="subject" type="text" placeholder="Brief summary" required />
            </div>

            <div style="grid-column: 1 / -1;">
              <label for="descriptionInput">Description</label>
              <textarea id="descriptionInput" name="description" placeholder="Describe the issue or request." required></textarea>
            </div>

            <div id="staffFieldWrapper" style="display:none; grid-column: 1 / -1;">
              <label for="staffSelect">Assign Staff</label>
              <select id="staffSelect" name="assigned_staff_id">
                <option value="">Unassigned</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-btn">Submit Ticket</button>
            <a href="/ticket-list.html" class="ghost-btn">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await ensureAuthenticated();
        if (!user) return;

        if (user.role === 'Admin') {
          document.getElementById('studentFieldWrapper').style.display = 'block';
          document.getElementById('staffFieldWrapper').style.display = 'block';
        }

        if (user.role === 'Student') {
          document.getElementById('studentFieldWrapper').style.display = 'none';
        }

        if (user.role === 'Admin') {
          const studentResponse = await apiRequest('/api/users/students');
          const studentSelect = document.getElementById('studentSelect');
          studentResponse.forEach((student) => {
            const option = document.createElement('option');
            option.value = student.id;
            option.textContent = student.name;
            studentSelect.appendChild(option);
          });

          const staffResponse = await apiRequest('/api/users/staff');
          const staffSelect = document.getElementById('staffSelect');
          staffResponse.forEach((staff) => {
            const option = document.createElement('option');
            option.value = staff.id;
            option.textContent = staff.name;
            staffSelect.appendChild(option);
          });
        }

        document.getElementById('ticketForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const payload = {
            category: document.getElementById('categorySelect').value,
            subject: document.getElementById('subjectInput').value,
            description: document.getElementById('descriptionInput').value,
            priority: document.getElementById('prioritySelect').value,
            student_id: user.role === 'Admin' ? document.getElementById('studentSelect').value : undefined,
            assigned_staff_id: user.role === 'Admin' ? document.getElementById('staffSelect').value : undefined
          };

          try {
            const result = await apiRequest('/api/tickets', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            showToast('Ticket created successfully.');
            setTimeout(() => {
              window.location.href = `/ticket-detail.html?id=${result.ticketId}`;
            }, 400);
          } catch (error) {
            showToast(error.message, true);
          }
        });
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Support Portal</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-layout">
    <div class="auth-card">
      <h1>Student Support Portal</h1>
      <p>Sign in to manage tickets and support requests.</p>

      <form id="loginForm">
        <div style="margin-bottom: 16px;">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="student@college.edu" required />
        </div>

        <div style="margin-bottom: 20px;">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Your password" required />
        </div>

        <button type="submit" class="primary-btn" style="width: 100%;">Login</button>
      </form>

      <ul class="demo-list">
        <li>Student: student@college.edu / student123</li>
        <li>Staff: staff@college.edu / staff123</li>
        <li>Admin: admin@college.edu / admin123</li>
      </ul>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await fetchSession();
        if (user) {
          redirectToDashboard(user.role);
          return;
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
          event.preventDefault();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;

          try {
            const userData = await apiRequest('/api/login', {
              method: 'POST',
              body: JSON.stringify({ email, password })
            });

            redirectToDashboard(userData.role);
          } catch (error) {
            showToast(error.message, true);
          }
        });
      });
    </script>
  </body>
</html>

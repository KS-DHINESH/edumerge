<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">College Support Portal</div>
        <nav class="nav-links">
          <a href="/admin-dashboard.html">Dashboard</a>
          <a href="/reports.html">Reports</a>
        </nav>
        <div class="nav-actions">
          <button class="ghost-btn" onclick="logoutUser()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <h1>Reports</h1>
      </div>

      <section class="grid stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Tickets</div>
          <div class="stat-value" id="totalTickets">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Open Tickets</div>
          <div class="stat-value" id="openTickets">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">SLA Breaches</div>
          <div class="stat-value" id="breachTickets">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Age</div>
          <div class="stat-value" id="avgHours">0</div>
        </div>
      </section>

      <section class="chart-grid">
        <div class="chart-card">
          <h3>Status Trend</h3>
          <canvas id="statusChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Category Mix</h3>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Priority Distribution</h3>
          <canvas id="priorityChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Staff Workload</h3>
          <canvas id="staffChart"></canvas>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await ensureAuthenticated();
        if (!user) return;
        if (user.role !== 'Admin') {
          redirectToDashboard(user.role);
          return;
        }

        try {
          const reportData = await apiRequest('/api/reports');
          document.getElementById('totalTickets').textContent = reportData.overview.total || 0;
          document.getElementById('openTickets').textContent = reportData.overview.open || 0;
          document.getElementById('breachTickets').textContent = reportData.overview.slaBreaches || 0;
          document.getElementById('avgHours').textContent = `${Number(reportData.overview.averageAgeHours || 0).toFixed(1)}h`;

          const statusLabels = (reportData.statusBreakdown || []).map((item) => item.status);
          const statusValues = (reportData.statusBreakdown || []).map((item) => item.total);
          new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
              labels: statusLabels,
              datasets: [{
                data: statusValues,
                backgroundColor: ['#1f4f9d', '#f0ad4e', '#7a6ef6', '#ff8c42', '#2fbf71', '#6b7280'],
                borderColor: '#ffffff',
                borderWidth: 2
              }]
            },
            options: {
              cutout: '58%',
              plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } }
              }
            }
          });

          const categoryLabels = (reportData.categoryBreakdown || []).map((item) => item.category);
          const categoryValues = (reportData.categoryBreakdown || []).map((item) => item.total);
          new Chart(document.getElementById('categoryChart'), {
            type: 'bar',
            data: {
              labels: categoryLabels,
              datasets: [{
                label: 'Tickets',
                data: categoryValues,
                backgroundColor: ['#1f4f9d', '#3aaed8', '#7a6ef6', '#2ca76a', '#e7a93a', '#d85d5d'],
                borderRadius: 10
              }]
            },
            options: {
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, precision: 0 } }
            }
          });

          const priorityLabels = (reportData.priorityBreakdown || []).map((item) => item.priority);
          const priorityValues = (reportData.priorityBreakdown || []).map((item) => item.total);
          new Chart(document.getElementById('priorityChart'), {
            type: 'polarArea',
            data: {
              labels: priorityLabels,
              datasets: [{
                data: priorityValues,
                backgroundColor: ['#2ca76a', '#e7a93a', '#d85d5d', '#a33b74'],
                borderColor: '#ffffff',
                borderWidth: 2
              }]
            },
            options: {
              plugins: { legend: { position: 'bottom' } },
              scales: { r: { suggestedMin: 0 } }
            }
          });

          const staffLabels = (reportData.staffBreakdown || []).map((item) => item.name);
          const staffValues = (reportData.staffBreakdown || []).map((item) => item.total);
          new Chart(document.getElementById('staffChart'), {
            type: 'bar',
            data: {
              labels: staffLabels,
              datasets: [{
                label: 'Assigned Cases',
                data: staffValues,
                backgroundColor: '#45b6d9',
                borderRadius: 8
              }]
            },
            options: {
              indexAxis: 'y',
              plugins: { legend: { display: false } },
              scales: { x: { beginAtZero: true, precision: 0 } }
            }
          });
        } catch (error) {
          showToast(error.message, true);
        }
      });
    </script>
  </body>
</html>

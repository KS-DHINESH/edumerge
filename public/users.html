<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand">College Support Portal</div>
        <nav class="sidebar-nav">
          <a href="/admin-dashboard.html">Dashboard</a>
          <a class="active" href="/users.html">Users</a>
          <a href="/ticket-list.html">All Tickets</a>
          <a href="/reports.html">Reports</a>
        </nav>
        <div class="sidebar-footer">
          <span id="currentUser">Admin</span>
          <button class="ghost-btn" onclick="logoutUser()">Logout</button>
        </div>
      </aside>

      <main class="content-panel">
        <header class="content-header">
          <div>
            <p class="eyebrow">Administration</p>
            <h1>Manage Users</h1>
          </div>
        </header>

        <section class="section-card">
          <div class="toolbar">
            <h2>User Directory</h2>
            <button id="resetUserFormBtn" type="button" class="ghost-btn">New User</button>
          </div>

          <div class="user-manager-grid">
            <form id="userForm" class="user-form">
              <input type="hidden" id="userId" />
              <div class="form-grid">
                <div>
                  <label for="userName">Name</label>
                  <input id="userName" name="userName" type="text" placeholder="Full name" required />
                </div>
                <div>
                  <label for="userRole">Role</label>
                  <select id="userRole" name="userRole">
                    <option value="Student">Student</option>
                    <option value="Staff">Staff</option>
                    <option value="Admin">Admin</option>
                  </select>
                </div>
                <div>
                  <label for="userEmail">Email</label>
                  <input id="userEmail" name="userEmail" type="email" placeholder="user@college.edu" required />
                </div>
                <div>
                  <label for="userPassword">Password</label>
                  <input id="userPassword" name="userPassword" type="text" placeholder="Set password" />
                </div>
              </div>
              <div class="form-actions">
                <button id="saveUserBtn" class="primary-btn" type="submit">Create User</button>
                <button id="cancelEditBtn" class="ghost-btn" type="button">Cancel</button>
              </div>
            </form>

            <div class="user-list-table">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = await ensureAuthenticated();
        if (!user) return;
        if (user.role !== 'Admin') {
          redirectToDashboard(user.role);
          return;
        }

        document.getElementById('currentUser').textContent = `${user.name} (${user.role})`;

        const userForm = document.getElementById('userForm');
        const userTableBody = document.getElementById('userTableBody');
        const saveUserBtn = document.getElementById('saveUserBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const resetUserFormBtn = document.getElementById('resetUserFormBtn');

        function resetUserForm() {
          userForm.reset();
          document.getElementById('userId').value = '';
          saveUserBtn.textContent = 'Create User';
          document.getElementById('userRole').value = 'Student';
        }

        async function loadUsers() {
          const users = await apiRequest('/api/admin/users');
          renderUserTable(users || [], userTableBody);
        }

        userTableBody.addEventListener('click', async (event) => {
          const actionButton = event.target.closest('button[data-action]');
          if (!actionButton) return;

          const userId = Number(actionButton.dataset.userId);
          const action = actionButton.dataset.action;

          if (action === 'edit') {
            const users = await apiRequest('/api/admin/users');
            const selectedUser = users.find((item) => item.id === userId);
            if (!selectedUser) return;

            document.getElementById('userId').value = selectedUser.id;
            document.getElementById('userName').value = selectedUser.name;
            document.getElementById('userEmail').value = selectedUser.email;
            document.getElementById('userRole').value = selectedUser.role;
            document.getElementById('userPassword').value = '';
            saveUserBtn.textContent = 'Update User';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (action === 'delete') {
            if (!confirm('Remove this user? This action cannot be undone.')) {
              return;
            }

            try {
              await apiRequest(`/api/admin/users/${userId}`, { method: 'DELETE' });
              showToast('User deleted successfully.');
              await loadUsers();
            } catch (error) {
              showToast(error.message, true);
            }
          }
        });

        userForm.addEventListener('submit', async (event) => {
          event.preventDefault();

          const userId = document.getElementById('userId').value;
          const payload = {
            name: document.getElementById('userName').value.trim(),
            email: document.getElementById('userEmail').value.trim(),
            role: document.getElementById('userRole').value,
          };

          const password = document.getElementById('userPassword').value.trim();
          if (password) payload.password = password;

          if (!payload.name || !payload.email) {
            showToast('Name and email are required.', true);
            return;
          }

          try {
            if (userId) {
              await apiRequest(`/api/admin/users/${userId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
              });
              showToast('User updated successfully.');
            } else {
              await apiRequest('/api/admin/users', {
                method: 'POST',
                body: JSON.stringify(payload)
              });
              showToast('User created successfully.');
            }

            resetUserForm();
            await loadUsers();
          } catch (error) {
            showToast(error.message, true);
          }
        });

        cancelEditBtn.addEventListener('click', resetUserForm);
        resetUserFormBtn.addEventListener('click', resetUserForm);
        resetUserForm();
        await loadUsers();
      });
    </script>
  </body>
</html>
